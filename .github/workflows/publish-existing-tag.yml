# One-shot path when a GitHub release tag exists but npm/desktop jobs were skipped
# (e.g. release-please opened a bad version PR). Run manually from Actions.
name: Publish existing release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish (e.g. v2.0.0)
        required: true
        default: v2.0.0

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - name: Pack dist as tarball
        run: tar -czf dist.tgz -C dist .

      - name: Upload dist.tgz to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist.tgz --clobber

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  desktop:
    needs: publish-npm
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node node_modules/electron/install.js

      - run: npm run build

      - name: Package
        run: npx electron-builder --publish never

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installers produced" >&2
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber
