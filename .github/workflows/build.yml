name: build

on:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint:
    name: test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

  electron:
    name: electron package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm ci does not reliably fetch the Electron binary; without this the
      # build fails with an empty path.txt.
      - run: node node_modules/electron/install.js

      - run: npm run build

      # --dir skips installer generation: enough to catch a bad files list or a
      # missing module without paying for dmg/nsis/AppImage on every PR.
      - run: npx electron-builder --dir --publish never

      # The failure this exists for: an import added under electron/ without a
      # matching entry in electron-builder.yml packages cleanly and then dies at
      # runtime with ERR_MODULE_NOT_FOUND.
      - run: node scripts/check-packaged-imports.mjs

