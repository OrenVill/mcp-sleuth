appId: com.orenvill.sleuth
productName: Sleuth
copyright: MIT

directories:
  output: release
  buildResources: build

# `main` is injected only into the packaged app. The published npm package must
# keep no `main` field — it is a CLI (`bin`), and a `main` pointing at
# electron/main.js would make `require('@orenvill/mcp-sleuth')` boot a window.
extraMetadata:
  main: electron/main.js

# electron/main.js and electron/windowState.js import these three root modules.
# Omitting any of them produces an app that installs cleanly then crashes on
# launch, which is the failure this list exists to prevent.
files:
  - dist/**
  - electron/**
  - vault-file-handler.js
  - app-data-handler.js
  - daemon-lock.js
  - package.json
  - '!**/*.test.js'
  - '!**/*.map'

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  category: Development
  # Without this the binary is named from the scoped package — "@orenvillmcp-sleuth".
  executableName: mcp-sleuth
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
